name: Sunk bundle

# Builds the IBC bundle the Sunk Cost desktop app ships, smoke-tests it on
# Linux, macOS and Windows, and publishes it as a release for a version tag
# (for example 3.24.2-sunk.1, which must match sunk/VERSION).

on:
  push:
    branches: [master]
    tags: ["*-sunk.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: sunk/build.sh dist
      - uses: actions/upload-artifact@v5
        with:
          name: bundle
          path: dist/
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/download-artifact@v5
        with:
          name: bundle
          path: dist
      - shell: bash
        run: node sunk/smoke/smoke.mjs "dist/IBC-$(tr -d '[:space:]' < sunk/VERSION).tar.gz"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: bundle
          path: dist
      - name: Require the tag to match sunk/VERSION
        run: test "$GITHUB_REF_NAME" = "$(tr -d '[:space:]' < sunk/VERSION)"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "IBC $GITHUB_REF_NAME" \
            --notes "IBC $GITHUB_REF_NAME as bundled by the Sunk Cost desktop app. Source: this tag. sha256: $(cut -d' ' -f1 dist/*.sha256)"
